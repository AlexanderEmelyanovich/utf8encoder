name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake autopoint \
            libtool pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 \
            cmake libffi-dev libssl-dev \
            gettext

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.34

      # КРИТИЧНО: Полная очистка кэша Buildozer. 
      # Без этого он будет использовать старый битый SDK.
      - name: Clean old build cache
        run: rm -rf .buildozer ~/.buildozer

      - name: Setup Android SDK Paths
        id: sdk-paths
        run: |
          echo "ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=" >> $GITHUB_ENV

      - name: Accept Licenses and Install Build Tools (Manual SDK Management)
        run: |
          # Создаем папку, если нет
          mkdir -p "$ANDROID_HOME"
          
          # Принудительно принимаем лицензии (используем echo y, это стабильнее yes| в CI)
          echo "y" | sdkmanager --licenses > /dev/null 2>&1 || true
          
          # Скачиваем build-tools явно. Это гарантирует, что папка build-tools появится.
          sdkmanager "build-tools;33.0.2"

      - name: Build APK
        run: |
          unset ANDROID_NDK
          unset ANDROID_NDK_LATEST_HOME
          # Запускаем buildozer. Он увидит build-tools и продолжит сборку.
          buildozer -v android debug < /dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: encoder-apk
          path: bin/*.apk
          retention-days: 30
