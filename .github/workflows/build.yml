name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Clean cache
        run: rm -rf .buildozer ~/.buildozer

      # ГЛАВНОЕ: готовим SDK так, чтобы Buildozer НЕ запускал sdkmanager
      - name: Prepare SDK for Buildozer (no sdkmanager)
        run: |
          SDK_DEST="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DEST"

          # Копируем build-tools и platforms — этого достаточно для aidl
          cp -r /usr/local/lib/android/sdk/build-tools "$SDK_DEST/"
          cp -r /usr/local/lib/android/sdk/platforms "$SDK_DEST/"

          # Создаём минимальную папку tools, чтобы Buildozer не искал sdkmanager
          mkdir -p "$SDK_DEST/tools/bin"
          touch "$SDK_DEST/tools/bin/sdkmanager"
          chmod +x "$SDK_DEST/tools/bin/sdkmanager"

          echo "=== SDK contents ==="
          ls -la "$SDK_DEST"
          ls -la "$SDK_DEST/build-tools/"

          # Проверка: должен быть aidl в любой версии build-tools
          AIDL_PATH=$(find "$SDK_DEST/build-tools/" -name "aidl" -type f | head -n1)
          if [ -z "$AIDL_PATH" ]; then
            echo "ERROR: aidl not found in build-tools!"
            exit 1
          else
            echo "aidl found at: $AIDL_PATH"
          fi

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: encoder-apk
          path: bin/*.apk
          retention-days: 30

