name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake autopoint \
            libtool pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 \
            cmake libffi-dev libssl-dev \
            gettext

      - name: Install Buildozer from git
        run: |
          pip install --upgrade pip
          pip install git+https://github.com/kivy/buildozer
          pip install cython==0.29.34

      - name: Clean old build cache
        run: rm -rf .buildozer ~/.buildozer

      - name: Verify system SDK paths (debug)
        run: |
          echo "=== SDK root ==="
          ls -la /usr/local/lib/android/sdk/
          echo "=== build-tools ==="
          ls -la /usr/local/lib/android/sdk/build-tools/ || echo "No build-tools folder found"
          echo "=== NDK ==="
          ls -la /usr/local/lib/android/sdk/ndk/ || true
          echo "=== Ant ==="
          which ant

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: encoder-apk
          path: bin/*.apk
          retention-days: 30
