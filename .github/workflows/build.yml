name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip wget curl \
            autoconf automake autopoint \
            libtool pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 \
            cmake libffi-dev libssl-dev \
            gettext

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Clean old build cache
        run: rm -rf .buildozer ~/.buildozer

      - name: Prepare Android SDK folder
        run: mkdir -p "$HOME/.buildozer/android/platform/android-sdk/build-tools/33.0.2"

      - name: Download and extract build-tools 33.0.2 (manual install)
        run: |
          export ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          cd "$ANDROID_SDK_ROOT/build-tools/33.0.2"
          # Скачиваем build-tools для Linux
          wget -q https://dl.google.com/android/repository/build-tools_r33.0.2-linux.zip
          unzip
