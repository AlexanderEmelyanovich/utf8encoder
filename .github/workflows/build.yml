name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake autopoint \
            libtool pkg-config \
            zlib1g-dev \
            libncurses5-dev libncursesw5-dev \
            libtinfo6 \
            cmake libffi-dev libssl-dev \
            gettext

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: Clean old build cache
        run: rm -rf .buildozer ~/.buildozer

      - name: Accept SDK licenses and install build-tools
        run: |
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          # Принудительно принимаем лицензии
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # Ставим build-tools нужной версии (совместимой с API 33)
          sdkmanager "build-tools;33.0.2"

      - name: Build APK
        env:
          ANDROID_NDK_HOME: ""
          ANDROID_NDK_ROOT: ""
        run: |
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          unset ANDROID_NDK
          unset ANDROID_NDK_LATEST_HOME
          buildozer -v android debug < /dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: encoder-apk
          path: bin/*.apk
          retention-days: 30
