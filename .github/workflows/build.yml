name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Clean cache
        run: rm -rf .buildozer ~/.buildozer

      # ЭТАП 1: buildozer скачает SDK и sdkmanager, но упадёт на aidl
      - name: Step 1 — Download SDK (will fail on aidl, that's OK)
        run: buildozer android update || true

      # ЭТАП 2: вручную ставим build-tools через скачанный sdkmanager
      - name: Step 2 — Install build-tools manually
        run: |
          SDKMANAGER="$HOME/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager"
          if [ -f "$SDKMANAGER" ]; then
            echo "Found sdkmanager, installing build-tools..."
            echo "y" | "$SDKMANAGER" "build-tools;33.0.0"
            echo "y" | "$SDKMANAGER" "platforms;android-33"
          else
            echo "sdkmanager not found at $SDKMANAGER"
            echo "Contents of SDK dir:"
            ls -la "$HOME/.buildozer/android/platform/android-sdk/" || true
            ls -la "$HOME/.buildozer/android/platform/android-sdk/tools/bin/" || true
            exit 1
          fi

      # ЭТАП 3: сборка APK — build-tools уже на месте
      - name: Step 3 — Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: encoder-apk
          path: bin/*.apk
