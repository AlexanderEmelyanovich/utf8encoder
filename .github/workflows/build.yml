name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Clean cache
        run: rm -rf .buildozer ~/.buildozer

      # ГЛАВНЫЙ ТРЮК: готовим SDK для Buildozer вручную
      - name: Prepare Buildozer SDK folder
        run: |
          SDK_DEST="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DEST"

          # Копируем системные компоненты (они уже есть на раннере)
          cp -r /usr/local/lib/android/sdk/platforms "$SDK_DEST/"
          cp -r /usr/local/lib/android/sdk/build-tools "$SDK_DEST/"
          cp -r /usr/local/lib/android/sdk/tools "$SDK_DEST/"  # нужен для ant/etc
          cp -r /usr/local/lib/android/sdk/cmdline-tools "$SDK_DEST/"

          echo "=== SDK contents ==="
          ls -la "$SDK_DEST"
          ls -la "$SDK_DEST/build-tools/"

          # Проверка: должен быть aidl
          if [ ! -f "$SDK_DEST/build-tools/*/bin/aidl" ]; then
            echo "ERROR: aidl not found!"
            exit 1
          else
            echo "aidl found!"
          fi

      - name: Build APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: encoder-apk
          path: bin/*.apk
          retention-days: 30
