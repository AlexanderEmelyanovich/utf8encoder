name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Clean cache
        run: rm -rf .buildozer ~/.buildozer

      # Этап 1: buildozer скачает SDK, но упадёт на aidl — это нормально
      - name: Step 1 — Download SDK
        run: buildozer android update || true

      # Этап 2: ставим build-tools системным sdkmanager в папку buildozer
      - name: Step 2 — Install build-tools
        run: |
          BUILDOSER_SDK="$HOME/.buildozer/android/platform/android-sdk"
          SYSTEM_SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          
          echo "Installing build-tools into $BUILDOSER_SDK ..."
          echo "y" | "$SYSTEM_SDKMANAGER" --sdk_root="$BUILDOSER_SDK" "build-tools;33.0.0"
          echo "y"
